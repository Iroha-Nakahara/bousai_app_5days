{% extends "base.html" %}

{% block content %}
<div class="card map-card">
  <div class="section-header">
    <span class="icon">📍</span>
    <span>避難所マップ</span>
  </div>
  <div id="shelterMap"></div>
</div>

<div class="card weather-card">
  <div class="weather-header">
    <div class="weather-title">
      <span class="icon">⛅</span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <span class="refresh-badge">⟳ 10分おき自動更新</span>
  </div>

  <div id="weatherContent" class="weather-body">
    <p>読み込み中...</p>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  .alert-banner {
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #ffe4e4;
    border: 1px solid #f5b0b0;
    color: #c40000;
    font-weight: 700;
    line-height: 1.6;
  }

  .alert-banner small {
    display: block;
    margin-top: 4px;
    font-weight: 600;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([40.8244, 140.7400], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function getAlertBanner(data) {
        if (!data.warnings || data.warnings.length === 0) {
            return '';
        }

        const warningText = data.warnings
            .map(w => w.name || w.headline || '')
            .filter(Boolean)
            .join(' / ');

        const isAlert = warningText.includes('警報') || warningText.includes('特別警報') || warningText.includes('注意報');

        if (!isAlert) {
            return '';
        }

        return `
            <div class="alert-banner">
                ${warningText}
                <small>警報・特別警報が発表されています</small>
            </div>
        `;
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="muted">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="status-list">';
            data.warnings.forEach(warning => {
                const title = warning.headline || warning.name || '警報情報';
                const detail = warning.detail ? `<div class="muted">${warning.detail}</div>` : '';
                warningsHtml += `<li><strong>• ${title}</strong><div class="muted">状態: ${warning.status || '発表'}</div>${detail}</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="status-ok">✓ 現在、警報・注意報は発表されていません</p>';
        }

        const alertBanner = getAlertBanner(data);
        const headline = data.headline ? `<p><strong>${data.headline}</strong></p>` : '';

        weatherContent.innerHTML = `
            ${alertBanner}
            <div class="weather-area">📍 ${data.area_name || '青森市'}</div>
            ${headline}
            ${warningsHtml}
            <p class="muted">⏱ 最終確認: ${data.last_fetch_time || '更新中...'}</p>
            <p class="muted">🛰 気象庁最終発表: ${data.report_time || '不明'}</p>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 10 * 60 * 1000);
});
</script>
{% endblock %}
